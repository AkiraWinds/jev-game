[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-game"
version = "0.1.0"
description = "A minimal Python starter project."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typesafe-sdk>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
